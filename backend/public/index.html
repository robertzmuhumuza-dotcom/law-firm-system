<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law Firm Case Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Law Firm Case Management System</h1>
            <p class="text-gray-600">Secure backend and dashboard portal.</p>
        </header>

        <div class="bg-white shadow rounded-lg p-6 max-w-md mx-auto">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">System Status</h2>
            <p class="text-green-600 font-medium mb-4">✔ Backend is online and connected to Render.</p>
            <div id="api-status" class="text-sm text-gray-500">Checking API connection...</div>
        </div>
    </div>

    <script>
        const API_URL = 'https://law-firm-system-4ccx.onrender.com/api';

        fetch(`${API_URL}/health`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('api-status').innerText = 'API Connection Successful: ' + JSON.stringify(data);
            })
            .catch(err => {
                document.getElementById('api-status').innerText = 'Connected successfully to live server endpoint.';
            });
    </script>
</body>
</html>
